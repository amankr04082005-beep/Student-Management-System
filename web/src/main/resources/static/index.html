<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Student Management System</h1>
    <p>Java, Spring Boot, JDBC and MySQL</p>
  </header>

  <main>
    <section class="card">
      <h2 id="form-title">Add Student</h2>
      <form id="student-form">
        <label>Name <input type="text" id="name" placeholder="Aman Kumar" required></label>
        <label>Email <input type="text" id="email" placeholder="name@example.com" required></label>
        <label>Phone <input type="text" id="phone" placeholder="10 digits (optional)"></label>
        <label>Course
          <select id="course" required></select>
        </label>
        <label>Marks <input type="number" id="marks" step="0.01" placeholder="0 - 100" required></label>
        <div class="buttons">
          <button type="submit" id="save-btn">Add Student</button>
          <button type="button" id="cancel-btn" class="secondary hidden">Cancel</button>
        </div>
      </form>
      <p id="message" class="message"></p>
    </section>

    <section class="card">
      <div class="toolbar">
        <h2>Students</h2>
        <input type="text" id="search" placeholder="Search by name...">
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Course</th><th>Marks</th><th>Actions</th></tr>
          </thead>
          <tbody id="student-rows"></tbody>
        </table>
      </div>
      <p id="empty" class="empty hidden">No students found.</p>
    </section>

    <section class="card">
      <h2>Course-wise Student Count</h2>
      <ul id="course-counts" class="counts"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
